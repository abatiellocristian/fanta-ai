<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>FantaAI 26/27</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>


<body>


<header>

    <div class="logo">
        Fanta<span>AI</span> 26/27
    </div>

    <div class="header-right">

        <span>
            Budget:
            <strong id="myCredits">
                500
            </strong>
        </span>

    </div>

</header>


<main class="container">


    <!-- DASHBOARD -->

    <section class="dashboard">

        <div class="dashboard-card">

            <span>
                CREDITI
            </span>

            <strong id="myCredits">
                500
            </strong>

        </div>


        <div class="dashboard-card">

            <span>
                ROSA
            </span>

            <strong>
                0/25
            </strong>

        </div>


        <div class="dashboard-card">

            <span>
                ASTA
            </span>

            <strong>
                8
            </strong>

        </div>


        <div class="dashboard-card">

            <span>
                STATO
            </span>

            <strong>
                PRONTO
            </strong>

        </div>

    </section>



    <!-- CERCA -->

    <section class="card">

        <div class="section-title">

            <div>

                <h2>
                    Listone 2026/27
                </h2>

                <p>
                    Cerca e analizza qualsiasi giocatore.
                </p>

            </div>

        </div>


        <div class="search-row">

            <input
                id="playerSearch"
                type="text"
                placeholder="Cerca giocatore o squadra..."
            >


            <button
                onclick="filterRole('ALL')"
            >
                TUTTI
            </button>

            <button
                onclick="filterRole('P')"
            >
                P
            </button>

            <button
                onclick="filterRole('D')"
            >
                D
            </button>

            <button
                onclick="filterRole('C')"
            >
                C
            </button>

            <button
                onclick="filterRole('A')"
            >
                A
            </button>

        </div>


        <div
            id="playersList"
            class="players-list"
        ></div>

    </section>



    <!-- ANALISI -->

    <section
        id="playerDetails"
        class="card"
    >

        <div class="empty">

            Seleziona un giocatore dal listone.

        </div>

    </section>



    <!-- ASTA -->

    <section class="card">

        <div class="section-title">

            <div>

                <h2>
                    Assistente asta
                </h2>

                <p>
                    Controlla prezzi, rilanci e alternative.
                </p>

            </div>

        </div>


        <div
            id="auctionPanel"
            class="auction-panel"
        >

            <div class="empty">

                Nessuna asta attiva.

            </div>

        </div>

    </section>



    <!-- ROSA -->

    <section class="card">

        <div class="section-title">

            <div>

                <h2>
                    La mia rosa
                </h2>

            </div>

        </div>


        <div
            id="myRoster"
            class="my-roster"
        ></div>

    </section>


</main>


<script src="app.js"></script>

</body>

</html>
