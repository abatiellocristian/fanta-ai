name: FantAbba Ultimate Data Refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_data.py'
      - 'scripts/trigger-refresh.txt'
  schedule:
    - cron: '31 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas lxml html5lib beautifulsoup4 requests
      - name: Build full database
        run: python scripts/update_data.py
      - name: Commit refreshed data
        run: |
          git config user.name 'FantAbba Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/players.json data/meta.json
          git diff --cached --quiet || git commit -m 'chore: refresh full FantAbba 26/27 database'
          git push
