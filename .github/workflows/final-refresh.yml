name: FantAbba Final Refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/trigger-final.txt']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas lxml html5lib beautifulsoup4 requests
      - run: python scripts/refresh_full.py
      - name: Commit database
        run: |
          git config user.name 'FantAbba Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/players.json data/meta.json
          git diff --cached --quiet || git commit -m 'chore: update full FantAbba database'
          git push
