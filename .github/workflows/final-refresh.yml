name: FantAbba Database Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fantabba-refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: Build full 26/27 database
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Refresh database
        run: python scripts/refresh_full.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Validate database
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/players.json')
          if not p.exists():
              raise SystemExit('players.json non trovato')
          data = json.loads(p.read_text(encoding='utf-8'))
          if not isinstance(data, list) or len(data) < 600:
              raise SystemExit(f'Database incompleto: {len(data) if isinstance(data,list) else "formato non valido"} giocatori')
          print(f'Database valido: {len(data)} giocatori')
          PY

      - name: Commit database
        run: |
          git config user.name 'FantAbba Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/players.json data/meta.json
          if git diff --cached --quiet; then
            echo 'Nessuna modifica al database.'
          else
            git commit -m 'chore: update FantAbba 26/27 database'
            git push
          fi
