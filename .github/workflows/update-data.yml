name: Aggiorna dati Fantacalcio
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas lxml html5lib beautifulsoup4
      - run: python scripts/update-data.py
      - name: Commit aggiornamenti
        run: |
          git config user.name 'fanta-ai-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/players.json
          git diff --cached --quiet || git commit -m 'Aggiorna listone e prezzi medi asta'
          git push
